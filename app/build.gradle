plugins {
    id 'com.android.application'
}

android {
    namespace 'it.panda.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'it.panda.launcher'
        // Le autoradio Android aftermarket vanno di solito da Android 8 a 13.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
